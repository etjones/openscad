name: Windows(msys2) Experimental Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        qt: [ qt5, qt6 ]
    runs-on: windows-latest
    name: windows-latest ${{ matrix.qt }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Setup (detached) tmate session if enabled
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true
      - name: Calculate PACBOY_PACKAGES
        shell: bash
        run: |
          pwd
          ./scripts/msys2-install-dependencies.sh ${{ matrix.qt }}
      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: libxml2
          pacboy: ${{ env.PACBOY_PACKAGES }}
      - name: Install Mesa
        uses: ssciwr/setup-mesa-dist-win@v3
        with:
          version: '22.1.7'
          build-type: 'release-mingw'
      - name: Build OpenSCAD
        run: |
          mkdir build && cd build
          cmake .. -G"Ninja" -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DEXPERIMENTAL=ON -DSNAPSHOT=ON -DENABLE_OCCT=ON -DUSE_QT6=${{ matrix.qt == 'qt6' && 'ON' || 'OFF' }}
          cmake --build . -j4
          cmake --install . --prefix=.
      - name: OCCT unit tests, one process each (diagnostic)
        shell: msys2 {0}
        run: |
          cd build
          ./OpenSCADUnitTests.exe --list-tests --verbosity quiet "[occt]" | while read -r tc; do
            ./OpenSCADUnitTests.exe "$tc" > /dev/null 2>&1; echo "exit $? : $tc"
          done
          for sec in "cut plus common is the whole" "cutting along a coincident surface leaves the body alone" "common of disjoint shapes is empty" "cut that removes everything is empty"; do
            ./OpenSCADUnitTests.exe "OcctBoolean cut and common" -c "$sec" > /dev/null 2>&1; echo "exit $? : cut and common / $sec"
          done
          for sec in "two equal spheres on a line: a capsule" "two unequal spheres: caps and a tangent cone" "four corner posts: a rounded box" "two boxes: the convex hull of their vertices" "a sphere merely translated is exactly an offset hull"; do
            ./OpenSCADUnitTests.exe "OcctHull closed forms" -c "$sec" > /dev/null 2>&1; echo "exit $? : hull closed forms / $sec"
          done
          ./openscad.com -o primitives.json --export-format step-metrics ../tests/data/scad/step/primitives.scad > /dev/null 2>&1; echo "exit $? : step-metrics primitives"
          ./openscad.com -o booleans.json --export-format step-metrics ../tests/data/scad/step/booleans.scad > /dev/null 2>&1; echo "exit $? : step-metrics booleans"
      - name: Run Test Suite
        run: |
          cd build
          ctest -j4
      - name: Setup (detached) tmate session if enabled
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      - name: Upload Test Result Report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Test Result Report (Windows ${{ matrix.qt }})
          path: |
            build/Testing/Temporary/*_report.html
            build/Testing/Temporary/LastTest.log
