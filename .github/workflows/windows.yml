name: Windows(msys2) Experimental Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        qt: [ qt6 ]
        msystem: [ UCRT64 ]
        mimalloc: [ OFF ]
    runs-on: windows-latest
    name: windows-latest ${{ matrix.qt }} ${{ matrix.msystem }} occt mimalloc=${{ matrix.mimalloc }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Setup (detached) tmate session if enabled
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true
      - name: Calculate PACBOY_PACKAGES
        shell: bash
        run: |
          pwd
          ./scripts/msys2-install-dependencies.sh ${{ matrix.qt }}
      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: libxml2
          pacboy: ${{ env.PACBOY_PACKAGES }}
      - name: Install Mesa
        uses: ssciwr/setup-mesa-dist-win@v3
        with:
          version: '22.1.7'
          build-type: 'release-mingw'
      # OpenCASCADE is built from source rather than taken from msys2: the
      # msys2 7.9.3-3 package segfaults inside Extrema_ExtCC on the first
      # point classified against a boolean result, while the same sources
      # built with the same GCC do not (scripts/ci/occt-probe.cpp shows
      # both). The build is cached on the version and options below.
      - name: Restore OpenCASCADE
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: occt-install
          key: occt-7.9.3-${{ matrix.msystem }}-src-v1
      - name: Build OpenCASCADE from source
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o occt.tar.gz https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_9_3.tar.gz
          tar xzf occt.tar.gz && mv OCCT-7_9_3 occt
          cmake -S occt -B occt-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_MODULE_Draw=OFF -DBUILD_DOC_Overview=OFF -DUSE_TK=OFF -DUSE_TBB=OFF -DUSE_OPENGL=OFF \
            -DUSE_XLIB=OFF -DUSE_RAPIDJSON=OFF -DUSE_FFMPEG=OFF -DUSE_D3D=OFF -DINSTALL_DIR_LAYOUT=Unix \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-install"
          cmake --build occt-build -j 4 2>&1 | grep -E "error" | head -20 || true
          cmake --install occt-build > /dev/null
          rm -rf occt occt-build occt.tar.gz
      # Saved here, not in a post step: actions/cache only saves when the job
      # succeeds, and a failing test suite must not cost the next run an
      # hour-long OpenCASCADE rebuild.
      - name: Save OpenCASCADE
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: occt-install
          key: occt-7.9.3-${{ matrix.msystem }}-src-v1
      - name: Build OpenSCAD
        run: |
          export PATH="$PWD/occt-install/bin:$PATH"
          mkdir build && cd build
          cmake .. -G"Ninja" -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DEXPERIMENTAL=ON -DSNAPSHOT=ON -DENABLE_OCCT=ON -DUSE_MIMALLOC=${{ matrix.mimalloc }} -DCMAKE_PREFIX_PATH="$PWD/../occt-install" -DUSE_QT6=${{ matrix.qt == 'qt6' && 'ON' || 'OFF' }}
          cmake --build . -j4
          cmake --install . --prefix=.
      - name: Run Test Suite
        run: |
          export PATH="$PWD/occt-install/bin:$PATH"
          cd build
          ctest -j4
      - name: Setup (detached) tmate session if enabled
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      - name: Upload Test Result Report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Test Result Report (Windows ${{ matrix.qt }} ${{ matrix.msystem }})
          path: |
            build/Testing/Temporary/*_report.html
            build/Testing/Temporary/LastTest.log
